<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2FA Demo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Auth Demo</h1>

<div id="auth-box">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>

</div>

<div id="twofa-box" style="display:none">

<h2>Enter 2FA Code</h2>

<input id="token" placeholder="6 digit code">

<button onclick="verify2FA()">Verify</button>

</div>

<div id="result"></div>

<script src="app.js"></script>

<div id="dashboard" style="display:none">

<h2>Dashboard</h2>

<p id="user-email"></p>

<button onclick="enable2FA()">Activar 2FA</button>

<button onclick="showChangePassword()">Cambiar contraseña</button>

<button onclick="deleteAccount()">Eliminar cuenta</button>

<button onclick="logout()">Cerrar sesión</button>

</div>

<div id="change-password" style="display:none">

<h3>Cambiar contraseña</h3>

<input id="new-password" type="password" placeholder="Nueva contraseña">

<button onclick="changePassword()">Actualizar contraseña</button>

</div>

<div id="twofa-setup" style="display:none">

<h3>Escanea este QR con tu app de autenticación</h3>

<img id="qr-image" width="200"/>

<p>Luego ingresa el código generado:</p>

<input id="verify-token" placeholder="Código 6 dígitos">

<button onclick="confirm2FA()">Confirmar 2FA</button>

</div>

</body>
</html>
